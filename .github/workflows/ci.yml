name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        go-version: ['1.24']
        module: ['transmitter', 'shared', 'dj']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.module }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.module }}-
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: cd ${{ matrix.module }} && go mod download
    
    - name: Verify dependencies
      run: cd ${{ matrix.module }} && go mod verify
    
    - name: Run tests
      run: cd ${{ matrix.module }} && go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./${{ matrix.module }}/coverage.out
        flags: unittests-${{ matrix.module }}
        name: codecov-${{ matrix.module }}
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module: ['transmitter', 'shared', 'dj']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: golangci-lint for ${{ matrix.module }}
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        working-directory: ${{ matrix.module }}
        args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module: ['transmitter', 'dj']  # Only modules with main.go
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build ${{ matrix.module }}
      run: cd ${{ matrix.module }} && go build -v ./...
    
    - name: Build ${{ matrix.module }} binary
      run: cd ${{ matrix.module }} && go build -o ${{ matrix.module }} ./cmd/main.go

  build-shared:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Build shared module
      run: cd shared && go build -v ./...

  security:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module: ['transmitter', 'shared', 'dj']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    
    - name: Install Gosec
      run: go install github.com/securego/gosec/v2/cmd/gosec@latest
    
    - name: Run Gosec Security Scanner for ${{ matrix.module }}
      run: cd ${{ matrix.module }} && gosec ./...