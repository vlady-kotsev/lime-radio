pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "transmitter/**/*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    
    goimports:
      glob: "transmitter/**/*.go"
      run: goimports -w {staged_files}
      stage_fixed: true
    
    govet:
      glob: "transmitter/**/*.go"
      run: cd transmitter && go vet ./...
    
    golangci-lint:
      glob: "transmitter/**/*.go"
      run: cd transmitter && golangci-lint run --timeout=5m
    
    gomod:
      glob: "transmitter/go.{mod,sum}"
      run: cd transmitter && go mod tidy
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    tests:
      run: cd transmitter && go test -v -race ./...
    
    build:
      run: cd transmitter && go build -v ./...
    
    security:
      run: cd transmitter && gosec ./...
    
    verify-deps:
      run: cd transmitter && go mod verify