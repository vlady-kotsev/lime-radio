pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    
    goimports:
      glob: "*.go"
      run: goimports -w {staged_files}
      stage_fixed: true
    
    govet:
      glob: "*.go"
      run: go vet ./...
    
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --timeout=5m
    
    gomod:
      glob: "go.{mod,sum}"
      run: go mod tidy
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    tests:
      run: go test -v -race ./...
    
    build:
      run: go build -v ./...
    
    security:
      run: gosec ./...
    
    verify-deps:
      run: go mod verify